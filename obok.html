<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Gazety</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Playfair+Display:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;padding:16px;background:#ede8de;font-family:system-ui,sans-serif;color:#1c1c1c}
h1,h2,p{margin:0}
input,textarea,button{font-family:inherit}
input:focus,textarea:focus{outline:2px solid #1c1c1c;outline-offset:1px}

#topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
#app-title{font-size:1rem;font-weight:700;color:#333;display:flex;align-items:center;gap:8px;margin:0}
#save-ind{font-size:.7rem;font-weight:400;transition:opacity .5s;opacity:0}
.bar-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:3px;background:#d9d3c7;border-radius:8px;padding:3px}
.tab-btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:400;background:transparent;color:#555}
.tab-btn.active{background:#1c1c1c;color:#fff;font-weight:600}
.top-btn{padding:8px 14px;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600}
#copy-top{background:#1c1c1c}
#copy-top.ok{background:#2e7d32}
#reset-btn{padding:8px 10px;background:none;color:#aaa;border:1px solid #ccc;border-radius:6px;cursor:pointer;font-size:.8rem}

.panel{display:none}.panel.active{display:block}

/* -- podglad -- */
#newspaper{background:#f4efe0;color:#1c1c1c;font-family:'IM Fell English',Georgia,serif;max-width:680px;margin:0 auto;padding:28px;border:1px solid #ccc;box-shadow:4px 4px 18px rgba(0,0,0,.1)}
#np-mast{font-family:'Cinzel',Georgia,serif;font-size:clamp(1.8rem,4vw,2.8rem);text-align:center;letter-spacing:2px;line-height:1.1;margin-bottom:6px}
#np-motto{text-align:center;font-style:italic;font-size:.82rem;color:#555;margin-bottom:10px}
#np-meta{display:flex;justify-content:space-between;border-top:3px solid #1c1c1c;border-bottom:1px solid #1c1c1c;padding:4px 0;margin-bottom:20px;font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase}
#np-cols{display:grid;grid-template-columns:1fr 1fr}
.np-col{padding:0 16px}.np-col:first-child{border-right:1px solid #aaa;padding-left:0}.np-col:last-child{padding-right:0}
.np-art{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #ccc}.np-art:last-child{border:none;margin:0;padding:0}
.np-dz{font-size:.58rem;letter-spacing:2.5px;text-transform:uppercase;color:#888;margin-bottom:3px}
.np-hd{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:1.05rem;line-height:1.2;margin:0 0 5px}
.np-bd{font-size:.82rem;line-height:1.6;margin:0}
.np-lnk{display:inline-block;margin-top:4px;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;color:#666;text-decoration:none;border-bottom:1px solid #999}
#np-stopka{margin-top:22px;padding-top:12px;border-top:1px solid #1c1c1c;text-align:center;font-size:.7rem;line-height:1.6;color:#777}
#np-stopka a{color:#666;text-decoration:none;border-bottom:1px solid #999}

/* -- edytor -- */
.card{background:#fff;border:1px solid #ddd8cc;border-radius:8px;padding:16px;margin-bottom:12px}
.sec-h{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#888;padding-bottom:8px;border-bottom:2px solid #1c1c1c;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:8px}
.lbl{display:block;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:#999;margin-bottom:3px}
.inp{width:100%;padding:7px 9px;border:1px solid #ddd;border-radius:5px;font-size:.88rem;background:#faf9f7}
.ta{width:100%;padding:7px 9px;border:1px solid #ddd;border-radius:5px;font-size:.83rem;line-height:1.55;min-height:64px;resize:vertical;background:#faf9f7;font-family:inherit}
.cols-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.art-card{background:#faf8f4;border:1px solid #e8e2d8;border-radius:6px;padding:11px;margin-bottom:8px}
.art-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.art-num{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#bbb}
.rm-btn{background:none;border:none;color:#ccc;cursor:pointer;font-size:1.2rem;line-height:1;padding:0 2px}.rm-btn:hover{color:#e53935}
.add-btn{width:100%;padding:8px;border:2px dashed #ccc;background:none;border-radius:6px;color:#aaa;cursor:pointer;font-size:.82rem}.add-btn:hover{border-color:#888;color:#555}

/* -- rss -- */
.rss-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.rss-row .fld{flex:1 1 260px;margin-bottom:0}
.rss-btn{padding:8px 14px;background:#1c1c1c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap}
.rss-btn:disabled{background:#aaa;cursor:wait}
.rss-small{padding:7px 10px;background:#555;color:#fff;border:none;border-radius:5px;cursor:pointer;font-size:.78rem}
.rss-opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:.78rem;color:#666}
.rss-opts input[type=number]{width:56px;padding:5px 7px;border:1px solid #ddd;border-radius:5px;background:#faf9f7}
.rss-opts select{padding:5px 7px;border:1px solid #ddd;border-radius:5px;background:#faf9f7;font-size:.78rem}
#rss-status{margin-top:10px;font-size:.8rem;line-height:1.5;min-height:1.2em}
#rss-status.err{color:#c62828}
#rss-status.ok{color:#2e7d32}

/* -- html tab -- */
#html-out{width:100%;height:260px;font-family:monospace;font-size:.74rem;padding:12px;border:1px solid #ddd;border-radius:6px;resize:vertical;background:#f8f7f4;color:#333}
.note{font-size:.82rem;color:#666;margin-bottom:10px;line-height:1.6}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.html-btn{padding:8px 16px;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:.83rem;font-weight:600}
#copy-web{background:#1c1c1c}#copy-web.ok{background:#2e7d32}
#copy-email{background:#555}#copy-email.ok{background:#2e7d32}

@media(max-width:600px){
  .grid2,.cols-grid,#np-cols{grid-template-columns:1fr}
  .np-col:first-child{border-right:none;border-bottom:1px solid #aaa;padding:0 0 14px;margin-bottom:14px}
  .np-col:last-child{padding:0}
}
</style>
</head>
<body>

<div id="topbar">
  <h1 id="app-title">Generator gazety <span id="save-ind"></span></h1>
  <div class="bar-right">
    <div class="tabs">
      <button class="tab-btn active" data-tab="podglad">Podglad</button>
      <button class="tab-btn" data-tab="edytor">Edytuj</button>
      <button class="tab-btn" data-tab="html">HTML</button>
    </div>
    <button class="top-btn" id="copy-top">Kopiuj HTML</button>
    <button id="reset-btn">Reset</button>
  </div>
</div>

<!-- PODGLAD -->
<div class="panel active" id="panel-podglad">
  <div id="newspaper">
    <div id="np-mast"></div>
    <div id="np-motto"></div>
    <div id="np-meta"><span id="np-date"></span><span id="np-edition"></span></div>
    <div id="np-cols">
      <div class="np-col" id="np-col-0"></div>
      <div class="np-col" id="np-col-1"></div>
    </div>
    <div id="np-stopka"></div>
  </div>
</div>

<!-- EDYTOR -->
<div class="panel" id="panel-edytor">

  <div class="card">
    <div class="sec-h">Wczytaj z bloga (RSS)</div>
    <div class="rss-row">
      <div class="fld">
        <label class="lbl">Adres kanalu RSS</label>
        <input class="inp" id="rss-url" placeholder="https://twojblog.bearblog.dev/feed/?type=rss">
      </div>
      <button class="rss-btn" id="rss-load">Wczytaj wpisy</button>
    </div>
    <div class="rss-opts">
      <label>Ile wpisow: <input type="number" id="rss-count" value="6" min="1" max="20"></label>
      <label>Wstaw do:
        <select id="rss-target">
          <option value="split">obu kolumn (na przemian)</option>
          <option value="0">kolumny lewej</option>
          <option value="1">kolumny prawej</option>
        </select>
      </label>
      <label><input type="checkbox" id="rss-replace" checked> zastap istniejace artykuly</label>
      <label><input type="checkbox" id="rss-nocytat" checked> pomijaj cytat na poczatku</label>
      <label>Dlugosc zajawki: <input type="number" id="rss-len" value="200" min="60" max="600" step="20"></label>
    </div>
    <div id="rss-status"></div>
  </div>

  <div class="card">
    <div class="sec-h">Naglowek gazety</div>
    <div class="grid2">
      <div class="fld"><label class="lbl">Tytul</label><input class="inp" id="f-masthead"></div>
      <div class="fld"><label class="lbl">Motto</label><input class="inp" id="f-motto"></div>
      <div class="fld"><label class="lbl">Data</label><input class="inp" id="f-date"></div>
      <div class="fld"><label class="lbl">Numer wydania</label><input class="inp" id="f-edition"></div>
    </div>
  </div>

  <div class="card">
    <div class="sec-h">Stopka</div>
    <div class="fld"><label class="lbl">Tekst stopki</label><input class="inp" id="f-stopka"></div>
    <div class="grid2">
      <div class="fld"><label class="lbl">Link (np. mailto:...)</label><input class="inp" id="f-stopkaLink" placeholder="mailto:adres@example.com?subject=Wypisz"></div>
      <div class="fld"><label class="lbl">Napis na linku</label><input class="inp" id="f-stopkaLinkTxt" placeholder="Wypisz sie"></div>
    </div>
  </div>
  <div class="cols-grid">
    <div>
      <div class="sec-h">Kolumna lewa</div>
      <div id="col-0-articles"></div>
      <button class="add-btn" data-col="0">+ Dodaj artykul</button>
    </div>
    <div>
      <div class="sec-h">Kolumna prawa</div>
      <div id="col-1-articles"></div>
      <button class="add-btn" data-col="1">+ Dodaj artykul</button>
    </div>
  </div>
</div>

<!-- HTML -->
<div class="panel" id="panel-html">
  <div class="card">
    <div class="sec-h">Gotowy kod HTML</div>
    <p class="note">
      <strong>Strona (Bear Blog):</strong> ustaw Content type: HTML.<br>
      <strong>Email (Gmail):</strong> Nowa wiadomosc &rarr; trzy kropki &rarr; Edytuj jako HTML &rarr; wklej.
    </p>
    <textarea id="html-out" readonly></textarea>
    <div class="btn-row">
      <button class="html-btn" id="copy-web">Kopiuj HTML (strona)</button>
      <button class="html-btn" id="copy-email">Kopiuj HTML (email/Gmail)</button>
    </div>
  </div>
</div>

<script>
var SAVE_KEY = "gazeta_v3";
var RSS_KEY  = "gazeta_rss_url";

var DEFAULTS = {
  masthead: "PTASZARNIA",
  motto: "Notatki z marginesu swiata",
  date: new Date().toLocaleDateString("pl-PL",{weekday:"long",year:"numeric",month:"long",day:"numeric"}),
  edition: "Nr 1",
  stopka: "Dostajesz ten list, bo zapisalas lub zapisales sie na newsletter Ptaszarni.",
  stopkaLink: "mailto:epublikator@gmail.com?subject=Wypisz",
  stopkaLinkTxt: "Wypisz sie",
  cols: [
    [
      {dzial:"LITERATURA", head:"Wharton po polsku",  body:"Po raz pierwszy Summer Edith Wharton ukazuje sie w polskim przekladzie.", link:""},
      {dzial:"ESEJ",       head:"Pareidolia",         body:"Mozg, ktory widzi wzory tam, gdzie ich nie ma.", link:""},
      {dzial:"HISTORIA",   head:"Twierdza Osowiec",   body:"Za grubymi murami kryja sie zapomniane opowiesci.", link:""}
    ],
    [
      {dzial:"ISLANDIA",   head:"Margret hin haga",   body:"Kim byla rzezbiarka, ktorej dlutom przypisuje sie szachy z Lewisu?", link:""},
      {dzial:"PRZYRODA",   head:"Biebrza wiosna",     body:"Bataliony odprawiaja toki, a zurawie kroca przez trzcinowiska.", link:""},
      {dzial:"FOTOGRAFIA", head:"Powrot do kliszy",   body:"Ziarnistosc analogu ma cos, czego algorytm nie potrafi nasladowac.", link:""}
    ]
  ]
};

/* ---- stan ---- */

var S = (function() {
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && p.cols && p.cols.length === 2) return p;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULTS));
})();

/* ---- helpers ---- */

function esc(s) {
  return String(s||"")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function showInd(msg, color) {
  var el = document.getElementById("save-ind");
  el.textContent = msg;
  el.style.color = color || "#2e7d32";
  el.style.opacity = "1";
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.style.opacity = "0"; }, 2000);
}

function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    showInd("\u2714 Zapisano", "#2e7d32");
  } catch(e) {
    showInd("\u26a0 Blad zapisu", "#c62828");
  }
}

/* ---- podglad ---- */

function renderPreview() {
  document.getElementById("np-mast").textContent    = S.masthead;
  document.getElementById("np-motto").textContent   = S.motto;
  document.getElementById("np-date").textContent    = S.date;
  document.getElementById("np-edition").textContent = S.edition;
  var st = document.getElementById("np-stopka");
  st.innerHTML = esc(S.stopka||"") +
    (S.stopkaLink ? '<br><a href="'+esc(S.stopkaLink)+'">'+esc(S.stopkaLinkTxt||"Wypisz sie")+'</a>' : '');
  [0,1].forEach(function(ci) {
    var col = document.getElementById("np-col-"+ci);
    col.innerHTML = "";
    S.cols[ci].forEach(function(art) {
      var d = document.createElement("div");
      d.className = "np-art";
      d.innerHTML =
        '<div class="np-dz">'+esc(art.dzial)+'</div>'+
        '<h2 class="np-hd">'+esc(art.head)+'</h2>'+
        '<p class="np-bd">'+esc(art.body)+'</p>'+
        (art.link ? '<a class="np-lnk" href="'+esc(art.link)+'">'+esc(art.linktxt||"Czytaj dalej")+'</a>' : '');
      col.appendChild(d);
    });
  });
}

/* ---- edytor ---- */

function renderEditor() {
  document.getElementById("f-masthead").value = S.masthead;
  document.getElementById("f-motto").value    = S.motto;
  document.getElementById("f-date").value     = S.date;
  document.getElementById("f-edition").value  = S.edition;
  document.getElementById("f-stopka").value        = S.stopka || "";
  document.getElementById("f-stopkaLink").value    = S.stopkaLink || "";
  document.getElementById("f-stopkaLinkTxt").value = S.stopkaLinkTxt || "";
  [0,1].forEach(function(ci) {
    var box = document.getElementById("col-"+ci+"-articles");
    box.innerHTML = "";
    S.cols[ci].forEach(function(art, ai) {
      var c = document.createElement("div");
      c.className = "art-card";
      c.innerHTML =
        '<div class="art-hdr">'+
          '<span class="art-num">Artykul '+(ai+1)+'</span>'+
          (S.cols[ci].length > 1 ? '<button class="rm-btn" data-col="'+ci+'" data-art="'+ai+'">&times;</button>' : '')+
        '</div>'+
        '<div class="fld"><label class="lbl">Dzial</label>'+
          '<input class="inp" data-col="'+ci+'" data-art="'+ai+'" data-field="dzial" value="'+esc(art.dzial)+'"></div>'+
        '<div class="fld"><label class="lbl">Naglowek</label>'+
          '<input class="inp" data-col="'+ci+'" data-art="'+ai+'" data-field="head" value="'+esc(art.head)+'"></div>'+
        '<div class="fld"><label class="lbl">Tekst</label>'+
          '<textarea class="ta" data-col="'+ci+'" data-art="'+ai+'" data-field="body">'+esc(art.body)+'</textarea></div>'+
        '<div class="grid2">'+
          '<div class="fld"><label class="lbl">Link (opcjonalny)</label>'+
            '<input class="inp" data-col="'+ci+'" data-art="'+ai+'" data-field="link" value="'+esc(art.link)+'" placeholder="/slug"></div>'+
          '<div class="fld"><label class="lbl">Napis na linku</label>'+
            '<input class="inp" data-col="'+ci+'" data-art="'+ai+'" data-field="linktxt" value="'+esc(art.linktxt||"")+'" placeholder="Czytaj dalej"></div>'+
        '</div>';
      box.appendChild(c);
    });
  });
}

/* ---- RSS ---- */

var RSS_PROXIES = [
  { typ:"xml",  url:function(u){ return "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u); } },
  { typ:"xml",  url:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); } },
  { typ:"json", url:function(u){ return "https://api.allorigins.win/get?url=" + encodeURIComponent(u); } },
  { typ:"r2j",  url:function(u){ return "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u); } },
  { typ:"xml",  url:function(u){ return "https://corsproxy.io/?url=" + encodeURIComponent(u); } },
  { typ:"xml",  url:function(u){ return "https://thingproxy.freeboard.io/fetch/" + u; } },
  { typ:"xml",  url:function(u){ return u; } }
];

function rssStatus(msg, cls) {
  var el = document.getElementById("rss-status");
  el.textContent = msg;
  el.className = cls || "";
}

function stripTags(s) {
  var t = document.createElement("div");
  t.innerHTML = String(s||"");
  return (t.textContent || "").replace(/\s+/g," ").trim();
}

/* Zamienia HTML opisu na czysta zajawke.
   Gdy pomijajCytat = true, odcina cytat stojacy na poczatku wpisu:
   - <blockquote> na starcie
   - pierwszy akapit zlozony w calosci z kursywy (<em>/<i>)
   - pierwszy akapit otwierajacy sie cudzyslowem */
function zajawkaZHtml(html, pomijajCytat) {
  var box = document.createElement("div");
  box.innerHTML = String(html||"");

  if (pomijajCytat) {
    var proby = 0;
    while (proby++ < 5) {
      var el = pierwszyElement(box);
      if (!el) break;
      if (jestCytatem(el)) { el.remove(); continue; }
      break;
    }
  }

  var tekst = tekstZOdstepami(box);
  if (pomijajCytat) {
    tekst = obetnijCudzyslow(tekst);
    if (!tekst) {
      var caly = document.createElement("div");
      caly.innerHTML = String(html||"");
      tekst = tekstZOdstepami(caly);
    }
  }
  return tekst;

  function tekstZOdstepami(rodzic) {
    var kopia = rodzic.cloneNode(true);
    kopia.querySelectorAll("p, div, br, li, blockquote, h1, h2, h3, h4").forEach(function(el) {
      el.insertAdjacentText("beforebegin", " ");
    });
    return (kopia.textContent || "").replace(/\s+/g," ").trim();
  }

  function pierwszyElement(rodzic) {
    for (var i = 0; i < rodzic.childNodes.length; i++) {
      var n = rodzic.childNodes[i];
      if (n.nodeType === 1) return n;
      if (n.nodeType === 3 && n.textContent.trim()) return null;
    }
    return null;
  }

  function jestCytatem(el) {
    var tag = el.tagName.toLowerCase();
    if (tag === "blockquote") return true;
    var tresc = (el.textContent || "").trim();
    if (!tresc) return true;
    if (tag === "em" || tag === "i") return true;
    if (tag === "p") {
      var kursywa = el.querySelector("em, i");
      if (kursywa && kursywa.textContent.trim().length >= tresc.length * 0.8) return true;
      if (/^[\u201e\u201c\u00ab"'\u2014-]/.test(tresc)) return true;
      if (tresc.length <= 400 && maPodpisAutora(tresc)) return true;
    }
    return false;
  }

  /* Czy akapit konczy sie podpisem zrodla? Np.:
     "... - Ayn Rand, Atlas zbuntowany, 1957"
     "... \u2014 Marzena Sekula"
     "... A.C.Clarke \"Wyspy na niebie\"" */
  function maPodpisAutora(t) {
    var DUZA = "A-Z\u0104\u0106\u0118\u0141\u0143\u00d3\u015a\u017b\u0179";
    var wzory = [
      new RegExp("[\\u2014\\u2013-]\\s*[" + DUZA + "][^.!?]{2,80}$"),
      new RegExp("[" + DUZA + "][\\wA-Za-z.\\u0105\\u0107\\u0119\\u0142\\u0144\\u00f3\\u015b\\u017c\\u017a]*(?:\\s+[" + DUZA + "][^\\s]*)*\\s*[\\u201e\\u201d\"][^\\u201d\"]{3,70}[\\u201d\"]\\s*$"),
      new RegExp(",\\s*\\d{4}\\s*$")
    ];
    for (var i = 0; i < wzory.length; i++) if (wzory[i].test(t)) return true;
    return false;
  }

  /* Odcina motto/cytat stojace na poczatku, gdy nie ma go w zadnym znaczniku.
     Rozpoznaje podpis autora: mysnik + nazwisko, albo nazwisko + tytul + rok,
     albo tytul w cudzyslowie. Tnie tylko w pierwszych ~400 znakach. */
  function obetnijCudzyslow(t) {
    var okno = t.slice(0, 420);

    var wzory = [
      /* ...tekst. \u2014 Autor Nazwisko  |  ...tekst - Autor, Tytul, 1957 */
      /^[\s\S]{15,380}?[\s\u201d\u00bb"']*[\u2014\u2013-]\s*[A-Z\u0104\u0106\u0118\u0141\u0143\u00d3\u015a\u017b\u0179][^.!?]{2,70}?(?:,\s*[^.!?]{2,60}?)?(?:,\s*\d{4})?\s*(?=[A-Z\u0104\u0106\u0118\u0141\u0143\u00d3\u015a\u017b\u0179])/,
      /* ...tekst. A.C.Clarke "Wyspy na niebie"  (autor + tytul w cudzyslowie) */
      /^[\s\S]{15,380}?[A-Z\u0104\u0106\u0118\u0141\u0143\u00d3\u015a\u017b\u0179][\w.\u0105\u0107\u0119\u0142\u0144\u00f3\u015b\u017c\u017a]*(?:\s+[A-Z\u0104\u0106\u0118\u0141\u0143\u00d3\u015a\u017b\u0179][\w.\u0105\u0107\u0119\u0142\u0144\u00f3\u015b\u017c\u017a]*)*\s*[\u201e\u201d"][^\u201d"]{3,60}[\u201d"]\s*/,
      /* "Cytat w cudzyslowie" + ewentualny podpis */
      /^[\u201e\u201c\u00ab"][^\u201d\u201c\u00bb"]{10,}[\u201d\u00bb"]\s*(?:[\u2014\u2013-]\s*\S[^.]{0,60}\.?)?\s*/
    ];

    for (var i = 0; i < wzory.length; i++) {
      var m = okno.match(wzory[i]);
      if (m && m[0].length >= 20) {
        var reszta = t.slice(m[0].length).trim();
        if (reszta.length >= 40) return reszta;
      }
    }
    return t;
  }
}

function skrocTekst(s, max) {
  s = String(s||"");
  if (s.length <= max) return s;
  var ciety = s.slice(0, max);
  var spacja = ciety.lastIndexOf(" ");
  if (spacja > max * 0.6) ciety = ciety.slice(0, spacja);
  return ciety.trim() + "\u2026";
}

function parseFeed(xmlText) {
  var doc = new DOMParser().parseFromString(xmlText, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("Nie udalo sie odczytac kanalu (bledny XML).");

  var wpisy = [];
  var nodes = doc.querySelectorAll("item");
  if (nodes.length) {
    nodes.forEach(function(n) {
      wpisy.push({
        head: stripTags(txt(n,"title")),
        link: (txt(n,"link") || "").trim(),
        bodyHtml: txt(n,"description") || txt(n,"encoded"),
        date: txt(n,"pubDate")
      });
    });
  } else {
    doc.querySelectorAll("entry").forEach(function(n) {
      var a = n.querySelector("link");
      wpisy.push({
        head: stripTags(txt(n,"title")),
        link: a ? (a.getAttribute("href") || "").trim() : "",
        bodyHtml: txt(n,"summary") || txt(n,"content"),
        date: txt(n,"updated") || txt(n,"published")
      });
    });
  }
  return wpisy.filter(function(w){ return w.head; });

  function txt(node, tag) {
    var el = node.getElementsByTagName(tag)[0];
    if (!el) {
      var all = node.getElementsByTagName("*");
      for (var i = 0; i < all.length; i++) {
        if (all[i].localName === tag) { el = all[i]; break; }
      }
    }
    return el ? el.textContent : "";
  }
}

function dzialZDaty(dateStr) {
  if (!dateStr) return "Z BLOGA";
  var d = new Date(dateStr);
  if (isNaN(d)) return "Z BLOGA";
  return d.toLocaleDateString("pl-PL", {day:"numeric", month:"long"}).toUpperCase();
}

async function pobierzFeed(url) {
  var bledy = [];
  for (var i = 0; i < RSS_PROXIES.length; i++) {
    var p = RSS_PROXIES[i];
    try {
      var res = await fetch(p.url(url), { headers: { "Accept": "*/*" } });
      if (!res.ok) { bledy.push("kod " + res.status); continue; }

      if (p.typ === "r2j") {
        var dane = await res.json();
        if (dane && dane.status === "ok" && dane.items && dane.items.length) {
          return { typ:"gotowe", wpisy: dane.items.map(function(it) {
            return {
              head: it.title || "",
              link: it.link || "",
              bodyHtml: it.description || it.content || "",
              date: it.pubDate || ""
            };
          }) };
        }
        bledy.push("brak wpisow");
        continue;
      }

      if (p.typ === "json") {
        var obj = await res.json();
        if (obj && obj.contents && obj.contents.indexOf("<") !== -1) {
          return { typ:"xml", tekst: obj.contents };
        }
        bledy.push("pusta odpowiedz");
        continue;
      }

      var tekst = await res.text();
      if (tekst && tekst.indexOf("<") !== -1) return { typ:"xml", tekst: tekst };
      bledy.push("pusta odpowiedz");
    } catch (e) {
      bledy.push("brak polaczenia");
    }
  }
  throw new Error("wszystkie proby zawiodly (" + bledy.join(", ") + ").");
}

document.getElementById("rss-load").addEventListener("click", async function() {
  var btn = this;
  var url = document.getElementById("rss-url").value.trim();
  if (!url) { rssStatus("Wpisz adres kanalu RSS.", "err"); return; }
  if (!/^https?:\/\//i.test(url)) url = "https://" + url;

  var ile      = Math.max(1, Math.min(20, parseInt(document.getElementById("rss-count").value, 10) || 6));
  var cel      = document.getElementById("rss-target").value;
  var zastap     = document.getElementById("rss-replace").checked;
  var bezCytatu  = document.getElementById("rss-nocytat").checked;
  var dlZajawki  = Math.max(60, Math.min(600, parseInt(document.getElementById("rss-len").value, 10) || 200));

  btn.disabled = true;
  rssStatus("Pobieram wpisy...", "");

  try {
    var wynik = await pobierzFeed(url);
    var wpisy = (wynik.typ === "gotowe" ? wynik.wpisy : parseFeed(wynik.tekst)).slice(0, ile);
    if (!wpisy.length) throw new Error("Kanal nie zawiera zadnych wpisow.");

    var artykuly = wpisy.map(function(w) {
      return {
        dzial: dzialZDaty(w.date),
        head:  w.head,
        body:  skrocTekst(zajawkaZHtml(w.bodyHtml, bezCytatu), dlZajawki),
        link:  w.link
      };
    });

    if (zastap) { S.cols[0] = []; S.cols[1] = []; }

    if (cel === "split") {
      artykuly.forEach(function(a, i){ S.cols[i % 2].push(a); });
    } else {
      var ci = parseInt(cel, 10);
      artykuly.forEach(function(a){ S.cols[ci].push(a); });
    }

    if (!S.cols[0].length) S.cols[0].push({dzial:"DZIAL",head:"Nowy artykul",body:"",link:""});
    if (!S.cols[1].length) S.cols[1].push({dzial:"DZIAL",head:"Nowy artykul",body:"",link:""});

    try { localStorage.setItem(RSS_KEY, url); } catch(e) {}

    renderEditor();
    renderPreview();
    save();
    rssStatus("Wczytano " + artykuly.length + " wpisow. Mozesz je teraz swobodnie edytowac.", "ok");
  } catch (err) {
    rssStatus("Nie udalo sie: " + err.message + " Sprawdz, czy adres jest poprawny (dla Bear Bloga konczy sie na /feed/?type=rss).", "err");
  } finally {
    btn.disabled = false;
  }
});
