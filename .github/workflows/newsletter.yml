name: Generuj newsletter z RSS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Uruchom skrypt generujący newsletter
        run: node newsletter-generator/generate-newsletter.js

      - name: Zapisz wygenerowany plik z powrotem w repozytorium
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add newsletter-generator/output/newsletter.html
          git commit -m "Automatyczna aktualizacja newslettera" || echo "Brak zmian do zapisania"
          git push
